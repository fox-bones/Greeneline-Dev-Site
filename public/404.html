<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark light; --bg: #0a0e13; --text: #e8edf3; --muted: #8e9bab; --accent: #ff8b3d; }
      @media (prefers-color-scheme: light) { :root { --bg: #f3f5f8; --text: #131a22; --muted: #586473; --accent: #b84a08; } }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      code { display: block; margin-bottom: 12px; color: var(--accent); font: 600 14px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; }
      h1 { margin: 0 0 8px; font-size: clamp(32px, 7vw, 52px); line-height: 1.1; letter-spacing: -0.03em; }
      p { margin: 0 0 24px; color: var(--muted); }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <code>404 / NO SIGNAL</code>
      <h1>This page isn’t on the network.</h1>
      <p>The address may have changed, or it may never have existed.</p>
      <a href="/">Back to the home page</a>
    </main>
  </body>
</html>
